name: Derivation, review, forgery or proof
description: A soundness derivation, a review of a term or a verifier, a forged proof, a Lean proof, or a lead worth trying.
title: "proven <kind>: <what it concerns>"
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Derivation
        - Review
        - Forgery
        - Lean proof
        - Lead
    validations:
      required: true
  - type: input
    id: concerns
    attributes:
      label: What it concerns
      description: An entry, a sheet term (C-FRI-FOLDING, say) or a pinned statement (P1 in lean/PINNED.md).
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: The work
      description: The derivation, review notes, forged statement and proof, Lean proof, or the lead with its source. Links are fine.
    validations:
      required: true
  - type: textarea
    id: credits
    attributes:
      label: Credits
      description: The people and agents behind it, each with a role.
