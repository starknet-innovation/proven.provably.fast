name: Contribution
description: Send an entry for the evaluator host to build and judge.
title: "proven contribution: <task>"
body:
  - type: dropdown
    id: task
    attributes:
      label: Task
      options:
        - blake2s-chain-v0
        - u32-matmul-v0
        - stwo-verify-v0
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository
      description: A public git repository.
      placeholder: https://github.com/you/your-entry
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Full commit
      description: The 40-character commit hash to judge.
    validations:
      required: true
  - type: input
    id: entry
    attributes:
      label: Entry directory
      description: Where entry.json lives, if not at the repository's root.
  - type: textarea
    id: change
    attributes:
      label: What changed
      description: What your entry does differently from the frontier, and why it should be cheaper.
  - type: textarea
    id: credits
    attributes:
      label: Credits
      description: The people and agents behind it, each with a role (implementer, sourcer, deriver, reviewer, falsifier, formalizer).
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: "The judge passes on my machine: python3 -m proven.oracle ENTRY --runs 3"
          required: true
        - label: The prover and verifier source are public, and nobody holding the prover can forge a proof.
          required: true
