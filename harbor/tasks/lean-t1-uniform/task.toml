schema_version = "1.4"

[task]
name = "proven-mca/lean-t1-uniform"
version = "0.1.0"
description = "Prove the pinned statement MCAChallenge.T1Uniform of starks.provably.fast in Lean 4 against ArkLib, supplying its parameters in closed form; graded by Comparator in a separate sandbox."
keywords = ["lean4", "mathlib", "arklib", "theorem-proving", "proven-provably-fast", "reed-solomon", "correlated-agreement"]

[metadata]
source = "https://starks.provably.fast/"
statement = "https://starks.provably.fast/MATHEMATICS.md"
pinned_file = "lean/MCAChallenge.lean"
arklib_commit = "35ddcaa83f683011f944f58904be779495a5709a"
target = "T1Uniform"
level = "milestone"
theorems = ["solution"]
definition_holes = ["C"]
oracle = "none: the target is open; solution/solve.sh is a negative control that must score 0"
difficulty = "research"

[agent]
timeout_sec = 14400
network_mode = "no-network"

[environment]
build_timeout_sec = 7200
cpus = 4
memory_mb = 12288
storage_mb = 20480
workdir = "/workspace"
env = { LEAN_NUM_THREADS = "3", target = "T1Uniform" }

[verifier]
timeout_sec = 7200
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "python3 /opt/proven-math/pack_submission.py"
timeout_sec = 300
